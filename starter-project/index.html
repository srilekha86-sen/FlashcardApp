<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
   
  <div id="createcard"> 
    <! In this section we are creating flash card>
  
  <div id="cardformbox" hidden> 
    <button id="toggleform">Add card</button>
    
    <form id="cardform" >
    <div class="form-group">
      <label for="question">Question: </label>
      <input type="text" id ="question">
    </div>
    
    <div class ="form-group">
      <label for="answer">Answer: </label>
      <input type="text" id ="answer">
    </div>
    <button type="submit">Save</button>
  </form>
</div>
  </div>
  <div id="panels">
<section id="managecard">
  <h2>FLASHCARD DECK</h2>
  <Ul id="cardlist"></Ul>
  <button id="startbutn" disabled>Start Studying</button>

</section>

<section id="studysession">
  <h2>RAPID TEST</h2>
  <p id="progress"> </p>
  <div class="flip-scene" id="flip-scene">
  <div class="flip-inner" id="flip-inner">
    <div class="face front" id="card-front"></div>
    <div class="face back" id="card-back"></div>
  </div>
</div>

  <div id="grade-row" hidden>
      <button id="wrong-btn">Incorrect</button>
      <button id="right-btn">Correct</button>
    </div>

    <button id="end-btn">End session</button>

</section>
</div>


  <script src="script.js"></script>
</body>
</html>
